<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivel 2: Registro Web (Archivo)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-top: 0;
      color: #1f2937;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #4b5563;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
    }
    .error-msg {
      color: #dc2626;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .alert {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
      text-align: center;
    }
    .alert-success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .alert-error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Registro de Usuario</h2>
    <div id="general-alert" class="alert"></div>

    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ej. juan123">
        <div id="error-username" class="error-msg"></div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="Ej. juan@correo.com">
        <div id="error-email" class="error-msg"></div>
      </div>

      <button type="submit">Registrar</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const generalAlert = document.getElementById('general-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Resetear alertas y errores
      generalAlert.style.display = 'none';
      document.querySelectorAll('.error-msg').forEach(el => {
        el.textContent = '';
        el.style.display = 'none';
      });

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email })
        });

        const result = await response.json();

        if (response.ok) {
          // Mostrar éxito
          generalAlert.className = 'alert alert-success';
          generalAlert.textContent = result.message;
          generalAlert.style.display = 'block';
          form.reset();
        } else {
          // Si hay errores de campos específicos
          if (result.errors) {
            Object.keys(result.errors).forEach(field => {
              const errorEl = document.getElementById(`error-${field}`);
              if (errorEl) {
                errorEl.textContent = result.errors[field];
                errorEl.style.display = 'block';
              }
            });
          } else {
            // Error general del servidor
            generalAlert.className = 'alert alert-error';
            generalAlert.textContent = result.message || 'Ocurrió un error inesperado';
            generalAlert.style.display = 'block';
          }
        }
      } catch (error) {
        generalAlert.className = 'alert alert-error';
        generalAlert.textContent = 'No se pudo conectar con el servidor';
        generalAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
