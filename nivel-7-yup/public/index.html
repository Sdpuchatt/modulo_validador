<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivel 7: Validación con Yup</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      max-width: 800px;
    }
    .container {
      display: flex;
      gap: 30px;
      width: 100%;
      max-width: 1000px;
      flex-wrap: wrap;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      flex: 1;
      min-width: 340px;
      border: 1px solid #e2e8f0;
    }
    h2 {
      margin-top: 0;
      color: #1e293b;
      text-align: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 15px;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #475569;
      font-weight: 600;
      font-size: 13px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }
    .error-msg {
      color: #ef4444;
      font-size: 12px;
      margin-top: 5px;
      display: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #0ea5e9;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #0284c7;
    }
    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
      font-size: 14px;
      text-align: center;
    }
    .alert-success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .alert-error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .users-list {
      margin-top: 15px;
      width: 100%;
      border-collapse: collapse;
    }
    .users-list th, .users-list td {
      border: 1px solid #e2e8f0;
      padding: 12px;
      text-align: left;
      font-size: 13px;
    }
    .users-list th {
      background-color: #f8fafc;
      color: #475569;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="color: #0f172a; margin-bottom: 10px;">Nivel 7: Validación con Yup</h1>
    <p style="color: #64748b; margin: 0; font-size: 15px;">
      Este proyecto utiliza <strong>Yup</strong>, una de las librerías universales de validación de esquemas en JavaScript.
    </p>
  </div>

  <div class="container">
    <!-- Formulario -->
    <div class="card">
      <h2>Registro con Yup</h2>
      <div id="general-alert" class="alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="username">Nombre de Usuario</label>
          <input type="text" id="username" name="username" placeholder="Mínimo 3 letras">
          <div id="error-username" class="error-msg"></div>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
          <div id="error-email" class="error-msg"></div>
        </div>

        <div class="form-group">
          <label for="age">Edad</label>
          <input type="text" id="age" name="age" placeholder="Mayor de 18 años">
          <div id="error-age" class="error-msg"></div>
        </div>

        <button type="submit" class="btn-submit">Registrar con Yup</button>
      </form>
    </div>

    <!-- Lista -->
    <div class="card">
      <h2>Usuarios Registrados</h2>
      <table class="users-list">
        <thead>
          <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Email</th>
            <th>Edad</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr>
            <td colspan="4" style="text-align: center; color: #64748b;">Cargando registros...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const generalAlert = document.getElementById('general-alert');
    const usersTbody = document.getElementById('users-tbody');

    async function loadUsers() {
      try {
        const response = await fetch('/users');
        const data = await response.json();
        
        if (data.success) {
          if (data.users.length === 0) {
            usersTbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #64748b;">No hay usuarios registrados</td></tr>';
            return;
          }
          usersTbody.innerHTML = data.users.map(u => `
            <tr>
              <td>${u.id}</td>
              <td>${u.username}</td>
              <td>${u.email}</td>
              <td>${u.age} (tipo: ${typeof u.age})</td>
            </tr>
          `).join('');
        }
      } catch (error) {
        usersTbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #ef4444;">Error al cargar la lista</td></tr>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      generalAlert.style.display = 'none';
      document.querySelectorAll('.error-msg').forEach(el => {
        el.textContent = '';
        el.style.display = 'none';
      });

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const age = document.getElementById('age').value;

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, age })
        });

        const result = await response.json();

        if (response.ok) {
          generalAlert.className = 'alert alert-success';
          generalAlert.textContent = result.message;
          generalAlert.style.display = 'block';
          form.reset();
          loadUsers();
        } else {
          if (result.errors) {
            Object.keys(result.errors).forEach(field => {
              const errorEl = document.getElementById(`error-${field}`);
              if (errorEl) {
                errorEl.textContent = result.errors[field];
                errorEl.style.display = 'block';
              }
            });
          } else {
            generalAlert.className = 'alert alert-error';
            generalAlert.textContent = result.message || 'Ocurrió un error inesperado';
            generalAlert.style.display = 'block';
          }
        }
      } catch (error) {
        generalAlert.className = 'alert alert-error';
        generalAlert.textContent = 'No se pudo conectar con el servidor';
        generalAlert.style.display = 'block';
      }
    });

    loadUsers();
  </script>
</body>
</html>
